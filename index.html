<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AeroNav Offline Tactical EFB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        :root {
            --hud-green: #00ff66;
            --hud-cyan: #00e5ff;
            --hud-magenta: #ff00ff;
            --hud-amber: #ffb700;
            --hud-red: #ff3344;
            --hud-bg: rgba(6, 14, 10, 0.92);
            --hud-border: rgba(0, 255, 102, 0.35);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background: #020604;
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden; color: var(--hud-green); user-select: none;
        }

        /* Tactical Vector Moving Map Canvas */
        #nav-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #071510 0%, #010604 100%);
            z-index: 1;
        }

        .hud-overlay { position: absolute; z-index: 10; pointer-events: none; }

        /* Top Nav Guidance Director */
        #nav-director {
            top: 12px; left: 50%; transform: translateX(-50%);
            background: var(--hud-bg); border: 1px solid var(--hud-border);
            border-radius: 6px; padding: 8px 20px; display: flex; gap: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .nav-cell { display: flex; flex-direction: column; align-items: center; }
        .nav-label { font-size: 9px; color: #7f998a; text-transform: uppercase; letter-spacing: 1px; }
        .nav-val { font-size: 15px; font-weight: bold; color: #fff; }
        .mag-val { color: var(--hud-magenta); }

        /* Speed & Altitude Flight Tapes */
        .tape {
            top: 50%; transform: translateY(-50%);
            background: var(--hud-bg); border: 1px solid var(--hud-border);
            padding: 12px 10px; border-radius: 6px; text-align: center;
            min-width: 82px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #speed-tape { left: 14px; border-left: 4px solid var(--hud-green); }
        #alt-tape { right: 14px; border-right: 4px solid var(--hud-cyan); }
        .tape-num { font-size: 28px; font-weight: bold; margin: 4px 0; }

        /* Center Pitch Ladder */
        #pitch-frame {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; height: 260px; overflow: hidden; border-radius: 50%;
            border: 1px dashed rgba(0, 255, 102, 0.2);
            display: flex; align-items: center; justify-content: center;
        }
        #pitch-ladder {
            width: 200px; height: 500px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .pitch-bar {
            width: 70px; height: 2px; background: var(--hud-green);
            margin: 14px 0; position: relative;
        }
        .pitch-bar.level { width: 140px; background: var(--hud-cyan); }

        /* Emergency Nearest Airport Divert Card */
        #divert-card {
            top: 75px; left: 14px; background: var(--hud-bg);
            border: 1px solid var(--hud-border); border-radius: 6px;
            padding: 10px 14px; font-size: 11px; min-width: 210px;
        }
        .divert-btn {
            background: #ff3344; color: #fff; border: none; font-family: monospace;
            padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer;
            margin-top: 6px; width: 100%; pointer-events: auto;
        }

        /* Bottom Status & Sensor Strip */
        #dash {
            bottom: 12px; left: 50%; transform: translateX(-50%);
            background: var(--hud-bg); border: 1px solid var(--hud-border);
            border-radius: 8px; padding: 10px 22px; display: flex; gap: 24px;
            pointer-events: auto;
        }

        #mode-toggle { color: var(--hud-amber); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Vector Tactical Offline Display -->
    <canvas id="nav-canvas"></canvas>

    <!-- Pitch Ladder / Artificial Horizon -->
    <div id="pitch-frame" class="hud-overlay">
        <div id="pitch-ladder">
            <div class="pitch-bar"></div>
            <div class="pitch-bar"></div>
            <div class="pitch-bar level"></div>
            <div class="pitch-bar"></div>
            <div class="pitch-bar"></div>
        </div>
    </div>

    <!-- Active Waypoint Navigation Bar -->
    <div id="nav-director" class="hud-overlay">
        <div class="nav-cell"><span class="nav-label">WPT</span><span id="wpt-val" class="nav-val mag-val">KSAN</span></div>
        <div class="nav-cell"><span class="nav-label">DIS</span><span id="dis-val" class="nav-val">0.0 NM</span></div>
        <div class="nav-cell"><span class="nav-label">BEARING</span><span id="brg-val" class="nav-val mag-val">---°</span></div>
        <div class="nav-cell"><span class="nav-label">TRACK</span><span id="trk-val" class="nav-val">---°</span></div>
        <div class="nav-cell"><span class="nav-label">ETE</span><span id="ete-val" class="nav-val">--:--</span></div>
    </div>

    <!-- Airspeed Tape -->
    <div id="speed-tape" class="hud-overlay tape">
        <div class="nav-label">AIRSPEED</div>
        <div id="speed-val" class="tape-num" style="color:var(--hud-green)">120</div>
        <div class="nav-label">KTS</div>
    </div>

    <!-- Altitude Tape -->
    <div id="alt-tape" class="hud-overlay tape">
        <div class="nav-label">ALTITUDE</div>
        <div id="alt-val" class="tape-num" style="color:var(--hud-cyan)">2500</div>
        <div class="nav-label">FT MSL</div>
    </div>

    <!-- Emergency Divert Panel -->
    <div id="divert-card" class="hud-overlay">
        <div style="color:var(--hud-amber); font-weight:bold;">EMERGENCY DIVERT</div>
        <div id="divert-info" style="margin-top:4px;">Calculating nearest...</div>
        <button class="divert-btn" id="divert-action">DIRECT-TO NEAREST</button>
    </div>

    <!-- Bottom Diagnostics -->
    <div id="dash" class="hud-overlay">
        <div class="nav-cell"><span class="nav-label">VVI</span><span id="vvi-val" class="nav-val">+0 FPM</span></div>
        <div class="nav-cell"><span class="nav-label">DENS ALT</span><span id="da-val" class="nav-val">2,780 FT</span></div>
        <div class="nav-cell"><span class="nav-label">CAUTION</span><span id="warn-val" class="nav-val" style="color:var(--hud-green)">NORMAL</span></div>
        <div class="nav-cell"><span class="nav-label">MODE</span><span id="mode-toggle">SIM (W/A/S/D)</span></div>
    </div>

    <script>
        // Offline Aeronautical Airport & Runway Database (Embedded)
        const airfields = [
            { id: "KSAN", name: "San Diego Intl", lat: 32.7338, lon: -117.1933, elev: 17, runways: ["09/27"] },
            { id: "KMYF", name: "Montgomery Field", lat: 32.8157, lon: -117.1396, elev: 427, runways: ["10L/28R", "05/23"] },
            { id: "KSEE", name: "Gillespie Field", lat: 32.8262, lon: -116.9722, elev: 388, runways: ["17/35", "09/27"] },
            { id: "KRNM", name: "Ramona Field", lat: 33.0390, lon: -116.9150, elev: 1393, runways: ["09/27"] },
            { id: "KCRQ", name: "McClellan-Palomar", lat: 33.1283, lon: -117.2800, elev: 331, runways: ["06/24"] }
        ];

        // Aircraft Flight Physics & Sensor Model
        const ac = {
            lat: 32.7338, lon: -117.1550,
            alt: 2500, speed: 120, hdg: 270,
            pitch: 0, roll: 0, vvi: 0,
            targetWpt: airfields[0],
            useGps: false
        };

        let nearestAirfield = airfields[0];

        // Vector Canvas Setup (100% Offline-Safe)
        const canvas = document.getElementById('nav-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Distance & Bearing Calculations (Great Circle / Rhumb Approximation)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 3440.065; // NM
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) * R).toFixed(1);
        }

        function calcBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
            return Math.round(((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360);
        }

        // Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (['arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key.toLowerCase() === 'c') { ac.pitch = 0; ac.roll = 0; }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Emergency Direct-To Handler
        document.getElementById('divert-action').addEventListener('click', () => {
            ac.targetWpt = nearestAirfield;
            document.getElementById('wpt-val').textContent = ac.targetWpt.id;
        });

        // Mode Selector: Toggle Live Sensor vs Flight Simulator
        const modeEl = document.getElementById('mode-toggle');
        modeEl.addEventListener('click', () => {
            ac.useGps = !ac.useGps;
            if (ac.useGps && "geolocation" in navigator) {
                modeEl.textContent = "LIVE GPS (IN-FLIGHT)";
                modeEl.style.color = "var(--hud-green)";
                navigator.geolocation.watchPosition(pos => {
                    if (!ac.useGps) return;
                    ac.lat = pos.coords.latitude;
                    ac.lon = pos.coords.longitude;
                    if (pos.coords.speed) ac.speed = Math.round(pos.coords.speed * 1.94384);
                    if (pos.coords.altitude) ac.alt = Math.round(pos.coords.altitude * 3.28084);
                    if (pos.coords.heading) ac.hdg = Math.round(pos.coords.heading);
                }, null, { enableHighAccuracy: true });
            } else {
                ac.useGps = false;
                modeEl.textContent = "SIM (W/A/S/D)";
                modeEl.style.color = "var(--hud-amber)";
            }
        });

        // Main Avionics Loop
        function runAvionics() {
            if (!ac.useGps) {
                // Controls
                if (keys['arrowup']) ac.speed = Math.min(ac.speed + 0.8, 350);
                if (keys['arrowdown']) ac.speed = Math.max(ac.speed - 0.8, 55);
                if (keys['w']) ac.pitch = Math.max(ac.pitch - 0.5, -20);
                if (keys['s']) ac.pitch = Math.min(ac.pitch + 0.5, 20);
                if (keys['a']) ac.roll = Math.max(ac.roll - 1.2, -45);
                else if (keys['d']) ac.roll = Math.min(ac.roll + 1.2, 45);
                else ac.roll *= 0.95;

                ac.hdg = (ac.hdg + (ac.roll * 0.04) + 360) % 360;
                ac.vvi = Math.round(ac.pitch * (ac.speed * 0.9));
                ac.alt = Math.max(0, Math.round(ac.alt + (ac.vvi / 60) * 0.05));

                const distSec = (ac.speed / 3600) * 0.05;
                const rad = ac.hdg * (Math.PI / 180);
                ac.lat += (distSec * Math.cos(rad)) / 60;
                ac.lon += (distSec * Math.sin(rad)) / (60 * Math.cos(ac.lat * (Math.PI / 180)));
            }

            // Waypoint Computations
            const dist = calcDistance(ac.lat, ac.lon, ac.targetWpt.lat, ac.targetWpt.lon);
            const brg = calcBearing(ac.lat, ac.lon, ac.targetWpt.lat, ac.targetWpt.lon);
            const eteSeconds = ac.speed > 0 ? Math.round((dist / ac.speed) * 3600) : 0;
            const eteM = String(Math.floor(eteSeconds / 60)).padStart(2, '0');
            const eteS = String(eteSeconds % 60).padStart(2, '0');

            // Find Nearest Airfield for Emergency Divert
            let minD = 9999;
            airfields.forEach(a => {
                const d = parseFloat(calcDistance(ac.lat, ac.lon, a.lat, a.lon));
                if (d < minD) { minD = d; nearestAirfield = a; }
            });

            // Update UI Tapes & Readouts
            document.getElementById('speed-val').textContent = String(Math.round(ac.speed)).padStart(3, '0');
            document.getElementById('alt-val').textContent = String(Math.round(ac.alt)).padStart(4, '0');
            document.getElementById('trk-val').textContent = `${String(Math.round(ac.hdg)).padStart(3, '0')}°`;
            document.getElementById('brg-val').textContent = `${String(brg).padStart(3, '0')}°`;
            document.getElementById('dis-val').textContent = `${dist} NM`;
            document.getElementById('ete-val').textContent = `${eteM}:${eteS}`;
            document.getElementById('vvi-val').textContent = `${ac.vvi >= 0 ? '+' : ''}${ac.vvi} FPM`;
            document.getElementById('da-val').textContent = `${Math.round(ac.alt * 1.08)} FT`; // Density Altitude approximation
            document.getElementById('divert-info').textContent = `${nearestAirfield.id} (${minD} NM) RWY:${nearestAirfield.runways[0]}`;

            // Pitch & Horizon Ladder
            document.getElementById('pitch-ladder').style.transform = `translateY(${ac.pitch * 3.5}px) rotate(${-ac.roll}deg)`;

            // Render Tactical Vector Map (No Internet Required)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = 2200; // pixels per degree

            // Range Compass Rings (5NM, 10NM, 15NM)
            [30, 60, 90].forEach(r => {
                ctx.beginPath();
                ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(0, 255, 102, 0.12)";
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Draw Airports & Runways
            airfields.forEach(a => {
                const x = cx + (a.lon - ac.lon) * scale;
                const y = cy - (a.lat - ac.lat) * scale;

                // Airfield circle & label
                ctx.fillStyle = a.id === ac.targetWpt.id ? "#ff00ff" : "#00e5ff";
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "11px Consolas";
                ctx.fillText(`${a.id} [${a.runways[0]}]`, x + 8, y + 4);
            });

            // Draw Active Flight Plan Route (Magenta Line)
            const tgtX = cx + (ac.targetWpt.lon - ac.lon) * scale;
            const tgtY = cy - (ac.targetWpt.lat - ac.lat) * scale;
            ctx.beginPath();
            ctx.setLineDash([8, 6]);
            ctx.moveTo(cx, cy);
            ctx.lineTo(tgtX, tgtY);
            ctx.strokeStyle = "#ff00ff";
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Center Aircraft Reticle
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((ac.hdg * Math.PI) / 180);
            ctx.strokeStyle = "#00ff66";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -18); ctx.lineTo(0, 18); // Fuselage
            ctx.moveTo(-16, 0); ctx.lineTo(16, 0); // Wings
            ctx.moveTo(-6, 14); ctx.lineTo(6, 14); // Tail
            ctx.stroke();
            ctx.restore();

            requestAnimationFrame(runAvionics);
        }

        // Offline PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        requestAnimationFrame(runAvionics);
    </script>
</body>
</html>
