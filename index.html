<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Aviation Glass Cockpit GPS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --hud-green: #00ff66;
            --hud-cyan: #00e5ff;
            --hud-amber: #ffb700;
            --hud-magenta: #d946ef;
            --hud-bg: rgba(6, 15, 12, 0.82);
            --hud-border: rgba(0, 255, 102, 0.35);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background: #050807;
            font-family: 'Share Tech Mono', 'Consolas', 'Courier New', monospace;
            overflow: hidden; color: var(--hud-green); user-select: none;
        }

        #map {
            height: 100vh; width: 100vw; position: absolute;
            top: 0; left: 0; background: #0b110e; z-index: 1;
        }

        /* Dark radar map filter */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(120%) saturate(60%);
        }

        /* Glass HUD Overlays */
        .hud-overlay {
            position: absolute; z-index: 1000; pointer-events: none;
        }

        /* Aircraft Center Reticle */
        #boresight {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70px; height: 70px;
        }
        #boresight svg {
            width: 100%; height: 100%;
            stroke: var(--hud-amber); stroke-width: 2.5; fill: none;
            filter: drop-shadow(0 0 6px rgba(255, 183, 0, 0.6));
        }

        /* Top Heading Tape */
        #heading-bar {
            top: 16px; left: 50%; transform: translateX(-50%);
            background: var(--hud-bg); border: 1px solid var(--hud-border);
            border-radius: 4px; padding: 6px 20px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        #hdg-val {
            font-size: 26px; font-weight: bold; color: var(--hud-cyan);
            letter-spacing: 2px;
        }
        .hud-label {
            font-size: 9px; text-transform: uppercase;
            letter-spacing: 1.5px; opacity: 0.7; color: #a1b5a9;
        }

        /* Left Speed Tape & Right Altitude Tape */
        .tape {
            top: 50%; transform: translateY(-50%);
            background: var(--hud-bg); border: 1px solid var(--hud-border);
            padding: 14px 10px; border-radius: 6px; text-align: center;
            min-width: 78px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }
        #speed-tape { left: 16px; border-left: 3px solid var(--hud-green); }
        #alt-tape { right: 16px; border-right: 3px solid var(--hud-cyan); }

        .tape-value {
            font-size: 28px; font-weight: bold; margin: 4px 0;
            text-shadow: 0 0 8px currentColor;
        }
        #speed-val { color: var(--hud-green); }
        #alt-val { color: var(--hud-cyan); }

        /* Bottom Glass Nav Dashboard */
        #dash {
            bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--hud-bg); border: 1px solid var(--hud-border);
            border-radius: 8px; padding: 12px 24px; display: flex; gap: 28px;
            backdrop-filter: blur(8px); pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }
        .dash-cell { display: flex; flex-direction: column; align-items: center; }
        .dash-val { font-size: 16px; font-weight: bold; color: #fff; margin-top: 2px; }

        /* Aircraft Position Marker */
        .plane-icon {
            transform-origin: center center;
            transition: transform 0.2s linear;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- HUD Boresight -->
    <div id="boresight" class="hud-overlay">
        <svg viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="4" fill="#ffb700" />
            <path d="M 12 30 L 22 30 M 38 30 L 48 30 M 30 18 L 30 24" />
        </svg>
    </div>

    <!-- Heading Readout -->
    <div id="heading-bar" class="hud-overlay">
        <div class="hud-label">Track (TRK)</div>
        <div id="hdg-val">360°</div>
    </div>

    <!-- Speed Tape (Knots) -->
    <div id="speed-tape" class="hud-overlay tape">
        <div class="hud-label">GS (KTS)</div>
        <div id="speed-val" class="tape-value">000</div>
    </div>

    <!-- Altitude Tape (Feet MSL) -->
    <div id="alt-tape" class="hud-overlay tape">
        <div class="hud-label">ALT (FT)</div>
        <div id="alt-val" class="tape-value">0000</div>
    </div>

    <!-- Avionics Flight Data Computer -->
    <div id="dash" class="hud-overlay">
        <div class="dash-cell">
            <span class="hud-label">Latitude</span>
            <span id="lat-val" class="dash-val">--.----</span>
        </div>
        <div class="dash-cell">
            <span class="hud-label">Longitude</span>
            <span id="lon-val" class="dash-val">--.----</span>
        </div>
        <div class="dash-cell">
            <span class="hud-label">VVI (FPM)</span>
            <span id="vvi-val" class="dash-val">+0</span>
        </div>
        <div class="dash-cell">
            <span class="hud-label">Nav Fix</span>
            <span id="fix-val" class="dash-val" style="color: var(--hud-amber);">SEARCH</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([32.9628, -117.0359], 13); // Default local center

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        // Aircraft Marker SVG
        const planeSvg = `
            <svg class="plane-icon" id="plane-symbol" width="40" height="40" viewBox="0 0 24 24" fill="#00ff66">
                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
        `;

        const planeIcon = L.divIcon({
            html: planeSvg,
            className: '',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        const marker = L.marker([32.9628, -117.0359], { icon: planeIcon }).addTo(map);

        // UI Element References
        const speedVal = document.getElementById('speed-val');
        const altVal = document.getElementById('alt-val');
        const hdgVal = document.getElementById('hdg-val');
        const latVal = document.getElementById('lat-val');
        const lonVal = document.getElementById('lon-val');
        const fixVal = document.getElementById('fix-val');

        // GPS Geolocation Watcher
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    
                    // Convert m/s to knots (1 m/s = 1.94384 knots)
                    const knots = pos.coords.speed ? Math.round(pos.coords.speed * 1.94384) : 0;
                    // Convert meters to feet (1 m = 3.28084 ft)
                    const feet = pos.coords.altitude ? Math.round(pos.coords.altitude * 3.28084) : 1200;
                    const track = pos.coords.heading ? Math.round(pos.coords.heading) : 360;

                    // Update HUD
                    speedVal.textContent = String(knots).padStart(3, '0');
                    altVal.textContent = String(feet).padStart(4, '0');
                    hdgVal.textContent = `${String(track).padStart(3, '0')}°`;
                    latVal.textContent = lat.toFixed(4);
                    lonVal.textContent = lon.toFixed(4);
                    fixVal.textContent = "3D GPS";
                    fixVal.style.color = "var(--hud-green)";

                    // Update Map & Symbol
                    marker.setLatLng([lat, lon]);
                    map.panTo([lat, lon], { animate: true, duration: 0.5 });
                    
                    const symbol = document.getElementById('plane-symbol');
                    if (symbol) symbol.style.transform = `rotate(${track}deg)`;
                },
                (err) => {
                    fixVal.textContent = "DEMO SIM";
                    fixVal.style.color = "var(--hud-amber)";
                },
                { enableHighAccuracy: true, maximumAge: 1000 }
            );
        }
    </script>
</body>
</html>
